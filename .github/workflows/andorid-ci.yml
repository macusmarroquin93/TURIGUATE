name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, AVANCES]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Compilacion, pruebas y Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK del proyecto
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Compilar aplicacion
        run: bash ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Ejecutar pruebas unitarias
        run: bash ./gradlew testDebugUnitTest --no-daemon --max-workers=2

      - name: Ejecutar Android Lint
        run: bash ./gradlew lintDebug --no-daemon --max-workers=2

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-calidad
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn